 peso ganha. É o efeito Zeigarnik.",content:"O cérebro PHDA transforma tarefas inacabadas em ameaças. Mensagens por responder viram 'assunto jurídico'. A culpa aumenta a fricção. Solução: modelo de resposta de 15 segundos. 'Olá, obrigado pela mensagem. Respondo com calma até amanhã às 18h.' Externaliza o compromisso. Reduz culpa, aumenta execução. 80% das mensagens não precisam de resposta perfeita.",readTime:"3 min",tags:["comunicação","ansiedade","culpa"],date:"8 Nov 2025",image:"mensagem"},{id:"escovar-dentes",title:"Escovar dentes com PHDA - motor recruitment",excerpt:"Não é preguiça. É o custo de ativação do movimento. O cérebro precisa de mais dopamina para começar.",content:"Motor recruitment: PHDA tem dificuldade em recrutar energia para iniciar tarefas de baixo estímulo mas necessárias. Escovar dentes, tomar banho, lavar loiça. Não é falta de vontade. É disfunção executiva. Estratégia: empilhar hábitos. Depois do café, escovo dentes. Sem decisão. Música específica para a tarefa. Reduzir fricção: escova elétrica já com pasta. Contar 20 segundos por quadrante, não 'até ficar limpo'.",readTime:"5 min",tags:["hábitos","ciência","rotina"],date:"2 Nov 2025",image:"habitos"},{id:"trabalho-ajuda",title:"PHDA no trabalho - pedir ajuda não é fraqueza",excerpt:"Acomodações razoáveis, não favores. O que podes pedir legalmente em Portugal.",content:"Artigo 84º Código Trabalho: trabalhador com condição crónica pode pedir adaptações. Exemplos: fones com cancelamento ruído, blocos de trabalho 50/10, instruções escritas, mesa perto de janela, flexibilidade horário. Não precisas divulgar diagnóstico completo. Basta relatório: 'necessita de estratégias X'. Empresas com >75 trabalhadores têm quota inclusão. Conhece direitos. Documenta pedidos por email.",readTime:"6 min",tags:["trabalho","direitos","PT"],date:"28 Out 2025",image:"trabalho"},{id:"nao-romantizem",title:"Não romantizem a PHDA - com Russell Barkley",excerpt:"PHDA não é superpoder. É perturbação séria com impacto na esperança de vida, diz Barkley.",content:"Russell Barkley: PHDA reduz esperança de vida até 9-13 anos quando não tratada, associada a acidentes, desemprego, divórcio, depressão, ansiedade. Por quê? Desregulação executiva crónica, não falta de esforço. Falar sério não é dramatizar, é proteger. PHDA Portugal traduz evidência sem frases feitas. Superpoder é marketing que invalida sofrimento real. Precisamos de ciência, não de merch.",readTime:"7 min",tags:["ciência","Barkley","manifesto"],date:"20 Out 2025",image:"ciencia"},{id:"seguros-discriminacao",title:"PHDA e seguros - discriminação em Portugal",excerpt:"Seguradoras recusam ou agravam prémios por PHDA. É legal? O que fazer.",content:"Seguros vida e saúde em PT pedem histórico psiquiátrico. PHDA é frequentemente classificada como 'perturbação mental' com agravamento 50-150%. Isto viola princípio proporcionalidade? DECO e ISP devem ser notificados. Estratégia: pede fundamentação escrita, recorre com relatório médico atual que comprove estabilidade funcional, compara 3 seguradoras. Lei 46/2006 proíbe discriminação por deficiência - PHDA pode enquadrar-se se impacto funcional comprovado.",readTime:"5 min",tags:["seguros","discriminação","direitos"],date:"15 Out 2025",image:"seguros"}];function bo(){let[e,n]=C.useState(!1),[t,r]=C.useState(!1),[l,u]=C.useState([]),[i,f]=C.useState(""),[c,s]=C.useState(null),[y,g]=C.useState(!1),[h,N]=C.useState(1),[P,k]=C.useState(null),[R,p]=C.useState(""),[d,v]=C.useState({name:"",email:"",nif:"",address:"",cp:"",city:""}),[w,H]=C.useState(!1),[E,O]=C.useState({entidade:"11249",ref:"999 123 456",valor:0}),[V,U]=C.useState(null),[M,Ge]=C.useState(""),[_r,Qd]=C.useState(!1),[xd,bd]=C.useState(!1),[jo,jd]=C.useState(""),[_d,_o]=C.useState(!1),[Hu,$d]=C.useState(null),Su=C.useRef(null),[es,ns]=C.useState(!1);C.useEffect(()=>{document.title="PHDA Portugal • Loja Oficial | PHDA na Prática e Fragmentados - Rui Pedro Ribeiro";let m=new IntersectionObserver(([ve])=>ve.isIntersecting&&ns(!0
